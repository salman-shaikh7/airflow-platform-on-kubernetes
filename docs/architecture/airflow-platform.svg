<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Airflow platform deployment architecture</title>
<desc id="desc">A deployment overview of the Airflow platform running on a local three-node Kubernetes cluster.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".14"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
 <marker id="dasharrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7c3aed"/></marker>
 <style>
  .heading{font:700 27px Inter,Segoe UI,sans-serif;fill:#0f172a}.subtitle{font:14px Inter,Segoe UI,sans-serif;fill:#64748b}
  .boundary{fill:#fff;stroke:#94a3b8;stroke-width:2}.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.namespace{fill:#fff;stroke:#a5b4fc;stroke-width:1.5;stroke-dasharray:7 5}
  .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.blue{fill:#eff6ff;stroke:#60a5fa}.orange{fill:#fff7ed;stroke:#fb923c}.green{fill:#ecfdf5;stroke:#34d399}.purple{fill:#f5f3ff;stroke:#a78bfa}
  .cap{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.3px;fill:#64748b}.title{font:700 14px Inter,Segoe UI,sans-serif;fill:#0f172a}.detail{font:12px Inter,Segoe UI,sans-serif;fill:#64748b}.small{font:11px Inter,Segoe UI,sans-serif;fill:#64748b}
  .flow{fill:none;stroke:#2563eb;stroke-width:2.8;marker-end:url(#arrow)}.control{fill:none;stroke:#7c3aed;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#dasharrow)}.storage{fill:none;stroke:#059669;stroke-width:2.5;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1440" height="820" rx="20" fill="url(#bg)"/>
<text x="42" y="44" class="heading">Airflow Platform on Kubernetes</text>
<text x="42" y="68" class="subtitle">Deployment overview · local multi-node learning environment</text>

<!-- Technology identity -->
<g filter="url(#shadow)">
 <rect x="1130" y="18" width="90" height="58" rx="12" class="card"/>
 <image href="logos/airflow.svg" x="1143" y="29" width="36" height="36"/>
 <text x="1187" y="52" class="small">Airflow</text>
 <rect x="1230" y="18" width="100" height="58" rx="12" class="card"/>
 <image href="logos/kubernetes.svg" x="1242" y="29" width="36" height="36"/>
 <text x="1285" y="52" class="small">K8s</text>
 <rect x="1340" y="18" width="65" height="58" rx="12" class="card"/>
 <image href="logos/linux.svg" x="1355" y="29" width="36" height="36"/>
</g>

<!-- Access zone -->
<rect x="35" y="100" width="225" height="665" rx="16" class="boundary"/>
<text x="55" y="128" class="cap">DEVELOPER LAPTOP</text>
<g filter="url(#shadow)">
 <rect x="58" y="165" width="180" height="88" rx="12" class="card blue"/>
 <text x="78" y="198" class="title">Browser</text><text x="78" y="223" class="detail">http://airflow.local</text>
 <rect x="58" y="300" width="180" height="88" rx="12" class="card purple"/>
 <text x="78" y="333" class="title">kubectl + Helm</text><text x="78" y="358" class="detail">Platform administration</text>
 <rect x="58" y="435" width="180" height="105" rx="12" class="card"/>
 <text x="78" y="468" class="title">Local name resolution</text><text x="78" y="493" class="detail">/etc/hosts</text><text x="78" y="517" class="small">airflow.local → 192.168.122.200</text>
 <rect x="58" y="620" width="180" height="92" rx="12" class="card"/>
 <text x="78" y="653" class="title">libvirt / KVM</text><text x="78" y="678" class="detail">virbr0 virtual network</text><text x="78" y="699" class="small">192.168.122.0/24</text>
</g>

<!-- Kubernetes boundary -->
<rect x="305" y="100" width="1100" height="665" rx="18" class="boundary"/>
<image href="logos/kubernetes.svg" x="328" y="116" width="34" height="34"/>
<text x="375" y="138" class="title">Kubernetes cluster</text>
<text x="510" y="138" class="detail">Three Ubuntu virtual machines</text>

<!-- Edge zone -->
<rect x="330" y="170" width="1050" height="155" rx="14" class="zone"/>
<text x="350" y="194" class="cap">PLATFORM EDGE</text>
<g filter="url(#shadow)">
 <rect x="355" y="215" width="205" height="82" rx="11" class="card blue"/>
 <text x="377" y="246" class="title">MetalLB</text><text x="377" y="271" class="detail">LoadBalancer IP · .200</text>
 <rect x="605" y="215" width="205" height="82" rx="11" class="card blue"/>
 <image href="logos/envoy.svg" x="625" y="235" width="38" height="38"/>
 <text x="677" y="247" class="title">Envoy Gateway</text><text x="677" y="271" class="detail">HTTP listener · port 80</text>
 <rect x="855" y="215" width="230" height="82" rx="11" class="card blue"/>
 <text x="877" y="246" class="title">HTTPRoute</text><text x="877" y="271" class="detail">Host: airflow.local</text>
 <rect x="1130" y="215" width="220" height="82" rx="11" class="card blue"/>
 <text x="1152" y="246" class="title">Airflow Service</text><text x="1152" y="271" class="detail">ClusterIP · port 8080</text>
</g>

<!-- Airflow namespace -->
<rect x="330" y="350" width="730" height="275" rx="14" class="namespace"/>
<image href="logos/airflow.svg" x="350" y="366" width="35" height="35"/>
<text x="397" y="389" class="title">airflow namespace</text>
<g filter="url(#shadow)">
 <rect x="355" y="425" width="185" height="78" rx="11" class="card orange"/>
 <text x="377" y="456" class="title">API Server + UI</text><text x="377" y="480" class="detail">Airflow entry point</text>
 <rect x="565" y="425" width="185" height="78" rx="11" class="card orange"/>
 <text x="587" y="456" class="title">Scheduler</text><text x="587" y="480" class="detail">KubernetesExecutor</text>
 <rect x="775" y="425" width="250" height="78" rx="11" class="card orange"/>
 <text x="797" y="456" class="title">DAG Processor · Triggerer</text><text x="797" y="480" class="detail">Parsing and deferred work</text>
 <rect x="565" y="530" width="185" height="65" rx="11" class="card orange"/>
 <text x="587" y="558" class="title">Temporary task Pods</text><text x="587" y="580" class="small">Created per scheduled task</text>
 <rect x="820" y="530" width="205" height="65" rx="11" class="card green"/>
 <image href="logos/postgresql.svg" x="840" y="545" width="35" height="35"/>
 <text x="890" y="558" class="title">PostgreSQL</text><text x="890" y="580" class="small">Airflow metadata</text>
</g>

<!-- Storage and runtime -->
<rect x="1090" y="350" width="290" height="275" rx="14" class="zone"/>
<text x="1110" y="378" class="cap">PERSISTENCE</text>
<g filter="url(#shadow)">
 <rect x="1115" y="415" width="240" height="78" rx="11" class="card green"/>
 <text x="1137" y="446" class="title">PersistentVolumeClaim</text><text x="1137" y="470" class="detail">8 GiB · local-path</text>
 <rect x="1115" y="530" width="240" height="65" rx="11" class="card green"/>
 <text x="1137" y="558" class="title">Worker-node filesystem</text><text x="1137" y="580" class="small">Lab-only local persistence</text>
</g>

<!-- Deployment nodes -->
<rect x="330" y="650" width="1050" height="88" rx="13" class="zone"/>
<text x="350" y="674" class="cap">DEPLOYMENT NODES</text>
<text x="365" y="713" class="title">Control plane</text><text x="465" y="713" class="detail">192.168.122.131</text>
<line x1="600" y1="680" x2="600" y2="725" stroke="#cbd5e1"/>
<text x="640" y="713" class="title">Worker 1</text><text x="715" y="713" class="detail">192.168.122.94</text>
<line x1="880" y1="680" x2="880" y2="725" stroke="#cbd5e1"/>
<text x="920" y="713" class="title">Worker 2</text><text x="995" y="713" class="detail">192.168.122.38</text>
<text x="1215" y="713" text-anchor="middle" class="small">Calico · Metrics Server<br/>MetalLB speakers · local-path</text>

<!-- Connections -->
<path d="M238 209 H285 V256 H345" class="flow"/>
<path d="M560 256 H595" class="flow"/><path d="M810 256 H845" class="flow"/><path d="M1085 256 H1120" class="flow"/>
<path d="M1240 297 V330 H448 V415" class="flow"/>
<path d="M238 344 H285 V690 H320" class="control"/>
<path d="M750 464 H765 V562 H760" class="control"/>
<path d="M750 562 H810" class="control"/>
<path d="M1025 562 H1075 V454 H1105" class="storage"/>
<path d="M1235 493 V520" class="storage"/>
</svg>
